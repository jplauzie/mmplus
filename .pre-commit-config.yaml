repos:
-   repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
    -   id: black
-   repo: https://github.com/PyCQA/flake8
    rev: 7.1.2
    hooks:
    -   id: flake8
        additional_dependencies: [flake8-docstrings]
-   repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
    -   id: isort
        name: isort (python)
-   repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
    -   id: nbstripout
-   repo: https://github.com/cpplint/cpplint
    rev: develop # change to a #version once they update their package
    hooks:
    -   id: cpplint
        args: [
            "--verbose=3",
            "--counting=toplevel",
            "--filter=-legal/copyright,-build/include_subdir,-build/include_what_you_use,-readability/casting",
            "--linelength=80"
            ]
-   repo: local
    hooks:
    # FYI https://gitlab.com/daverona/pre-commit/cpp
    -   id: clang-format
        name: clang-format
        description: Run `clang-format` against C/C++ header and source files
        language: python
        files: \.(h\+\+|h|hh|hxx|hpp|cuh|c|cc|cpp|cu|c\+\+|cxx|tpp|txx)$
        entry: clang-format
        args: ["-i", "-style=Chromium"]
