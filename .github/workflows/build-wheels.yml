name: Build wheels

on:
  push:
    branches: 
      - ci/build-wheels

jobs:
  build-wheels:
    name: Build (${{ matrix.os }}, CUDA ${{ matrix.cuda }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            cuda: "12.9"
            python: "3.13"

          # Windows
          - os: windows-latest
            cuda: "12.9"
            python: "3.13"

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel auditwheel

      # ================ LINUX ================
      - name: Build wheel on Linux (CUDA ${{ matrix.cuda }})
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v $PWD:/src \
            -w /src \
            nvidia/cuda:${{ matrix.cuda }}-devel-ubuntu22.04 \
            bash -eux << 'EOF'
              apt-get update
              apt-get install -y python3 python3-pip cmake
              pip3 install --upgrade pip build wheel auditwheel
              python3 -m build --wheel
              auditwheel repair dist/*.whl -w repaired/
          EOF

      # ================ WINDOWS ================
      - name: Install CUDA Toolkit (Windows)
        if: runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.14
        with:
          cuda: ${{ matrix.cuda }}

      - name: Build wheel on Windows
        if: runner.os == 'Windows'
        env:
          CUDA_PATH: ${{ env.CUDA_PATH }}
        run: |
          python -m pip install --upgrade pip build wheel
          python -m build --wheel

      # ================ UPLOAD ================
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mumaxplus-${{ matrix.os }}-cuda${{ matrix.cuda }}-py${{ matrix.python }}
          path: |
            dist/mumaxplus-*.whl
            repaired/mumaxplus-*.whl

