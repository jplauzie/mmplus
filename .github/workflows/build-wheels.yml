name: Build wheels

on:
  push:
    branches: 
      - ci/build-wheels

jobs:
  build-wheels:
    name: Build (${{ matrix.os }}, CUDA ${{ matrix.cuda }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-24.04
            cuda: "12.9.1"
            python: "3.13"

          # Windows
          - os: windows-latest
            cuda: "12.9.1"
            python: "3.13"

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: recursive


      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel auditwheel

      # ================ LINUX ================
      - name: Build wheel on Linux (CUDA ${{ matrix.cuda }})
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v $PWD:/src \
            -w /src \
            nvidia/cuda:${{ matrix.cuda }}-devel-ubuntu24.04 \
            bash -euxo pipefail << 'EOF'
              echo "=== System info ==="
              uname -a
              python3 --version || true
              nvcc --version || true

              echo "=== Installing tools ==="
              apt-get update
              apt-get install -y python3 python3-pip cmake
              pip3 install --upgrade pip build wheel auditwheel

              echo "=== Starting wheel build ==="
              python3 -m build --wheel

              echo "=== dist contents ==="
              find dist -maxdepth 2 -type f || echo "dist is empty"

              echo "=== Running auditwheel ==="
              auditwheel repair dist/*.whl -w repaired/

              echo "=== repaired contents ==="
              find repaired -maxdepth 2 -type f || echo "repaired is empty"
          EOF

      # ================ WINDOWS ================
      - name: Install CUDA Toolkit (Windows)
        if: runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ matrix.cuda }}

      - name: Build wheel on Windows (CUDA ${{ matrix.cuda }})
        if: runner.os == 'Windows'
        env:
          CUDA_PATH: ${{ env.CUDA_PATH }}
        run: |
          cmake --version
          nvcc --version
          python --version
          python -m pip install --upgrade pip build wheel
          python -m build --wheel

      # ================ UPLOAD ================
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mumaxplus-${{ matrix.os }}-cuda${{ matrix.cuda }}-py${{ matrix.python }}
          path: |
            dist/mumaxplus-*.whl
            repaired/mumaxplus-*.whl

